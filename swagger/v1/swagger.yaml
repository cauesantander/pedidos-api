---
openapi: 3.0.1
info:
  title: Pedidos API
  version: v1
servers:
- url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  "/customers":
    get:
      summary: List customers
      tags:
      - Customers
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Customers found
    post:
      summary: Create customer
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Customer created
        '422':
          description: Invalid customer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: João da Silva
                email:
                  type: string
                  example: joao@email.com
              required:
              - name
              - email
  "/customers/{id}":
    parameters:
    - name: id
      in: path
      example: 1
      required: true
      schema:
        type: integer
    get:
      summary: Get customer
      tags:
      - Customers
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Customer found
    patch:
      summary: Update customer
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Customer updated
        '422':
          description: Invalid customer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: João Atualizado
                email:
                  type: string
                  example: novo@email.com
    put:
      summary: Update customer
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Customer updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: João Atualizado
                email:
                  type: string
                  example: novo@email.com
    delete:
      summary: Delete customer
      tags:
      - Customers
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Customer deleted
  "/orders":
    get:
      summary: List orders
      tags:
      - Orders
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Orders found
    post:
      summary: Create order
      tags:
      - Orders
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Order created
        '422':
          description: Invalid order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: integer
                  example: 1
                status:
                  type: string
                  example: pending
                total:
                  type: number
                  format: float
                  example: 150.5
              required:
              - customer_id
              - status
              - total
  "/orders/{id}":
    parameters:
    - name: id
      in: path
      example: 1
      required: true
      schema:
        type: integer
    get:
      summary: Get order
      tags:
      - Orders
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Order found
    patch:
      summary: Update order
      tags:
      - Orders
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Order updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: integer
                  example: 1
                status:
                  type: string
                  example: completed
                total:
                  type: number
                  format: float
                  example: 200.0
    put:
      summary: Update order
      tags:
      - Orders
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Order updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: integer
                  example: 1
                status:
                  type: string
                  example: completed
                total:
                  type: number
                  format: float
                  example: 200.0
    delete:
      summary: Delete order
      tags:
      - Orders
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Order deleted
  "/login":
    post:
      summary: Login
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: usuario@email.com
                password:
                  type: string
                  example: '123456'
              required:
              - email
              - password
  "/register":
    post:
      summary: Register user
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: User created
        '422':
          description: Invalid user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: usuario@email.com
                    password:
                      type: string
                      example: '123456'
                    password_confirmation:
                      type: string
                      example: '123456'
                  required:
                  - email
                  - password
                  - password_confirmation
              required:
              - user
